<div class="p-6">
    <h3 mat-dialog-title class="text-xl font-bold mb-4 text-gray-800">Log New Incident</h3>

    <form (ngSubmit)="onSubmit()">
        <div mat-dialog-content>
            <!-- Incident Name Input Field -->
            <div class="mb-4">
                <label class="block text-sm font-regular text-gray-700 mb-1">Incident Name</label>
                <input type="text" name="incidentName" [(ngModel)]="incidentName" required
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Severity Dropdown (Matching Upper Case Enum Strings) -->
            <div class="mb-6">
                <label class="block text-sm font-regular text-gray-700 mb-1">Severity</label>
                <select name="severity" [(ngModel)]="severity"
                    class="w-full border border-gray-300 rounded px-3 py-2 bg-white">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HIGH">High</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>
        </div>

        <!-- Actions Footer buttons -->
        <div mat-dialog-actions class="flex justify-end gap-3">
            <button type="button" (click)="cancel()"
                class="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50">
                Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-regular rounded">
                Submit Incident
            </button>
        </div>
    </form>
</div>
