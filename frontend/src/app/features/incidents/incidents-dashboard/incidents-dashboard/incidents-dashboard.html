<header class="dashboard-header">
    <div class="header-content">
        <div class="title-group">
            <div class="title-row">
                <h1>Incident Management Dashboard</h1>

                @if (isLoading$ | async) {
                <div class="sync-badge">
                    <span class="pulse-dot"></span>
                    <span>Syncing with MongoDB...</span>
                </div>
                }
            </div>
            <p class="subtitle">Monitor, track, and resolve system incidents in real time.</p>
        </div>

        <button type="button" class="btn-primary" (click)="openCreateIncidentModal()">
            <span class="plus-icon">+</span>
            <span>New Incident</span>
        </button>
    </div>
</header>


<app-incident-list [data1]="(incidentList$|async) || []"></app-incident-list>
