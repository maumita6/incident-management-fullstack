<div class="mat-elevation-z2 overflow-x-auto rounded-lg">
    <table mat-table [dataSource]="dataSource" matSort class="max-w-4xl">

        <!-- Dynamic Columns -->
        @for (column of columns(); track column.key) {
        <ng-container [matColumnDef]="column.key">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="font-bold text-gray-700">
                {{ column.label }}
            </th>
            <td mat-cell *matCellDef="let element">
                <a href="#">{{ element[column.key] }}</a>
            </td>
        </ng-container>
        }

        <!-- Action Column (Conditional) -->
        @if (showActions()) {
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="font-bold text-gray-700 text-center"> Actions </th>
            <td mat-cell *matCellDef="let row" class="text-center">
                <button mat-icon-button color="primary" (click)="onView(row._id)">
                    <mat-icon>visibility</mat-icon>
                </button>
                <!--<button mat-icon-button color="secondary" (click)="onEdit(row._id)">
                    <mat-icon>edit</mat-icon>
                </button>-->
                <button mat-icon-button color="warn" (click)="onDelete(row._id)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>
        }

        <!-- Row definitions -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Reusable Pagination Footer -->
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons
        class="border-t border-gray-100">
    </mat-paginator>
</div>
